<title>Agent Architecture</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6b5c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23faf8f4' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root { --ink:#1a1d21; --soft:#4a5058; --paper:#faf8f4; --card:#fff; --line:#e5e0d6; --accent:#0f6b5c; --accent-soft:#e3efec; --amber:#a05e0b; --amber-soft:#f9efdd; --legacy:#8a8578; --rail:260px; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:16px/1.55 Charter, Georgia, 'Times New Roman', serif; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .ui { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  #app { display:flex; min-height:100%; }
  nav.rail { width:var(--rail); flex:0 0 var(--rail); border-right:1px solid var(--line); background:#f4f1ea; padding:22px 18px; position:sticky; top:0; height:100vh; overflow:auto; }
  nav.rail .brand { font:700 13px/1 -apple-system, sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:18px; display:flex; align-items:center; gap:8px; }
  nav.rail .brand .dot { width:14px; height:14px; border-radius:4px; background:var(--accent); display:inline-block; }
  nav.rail a.item { display:block; padding:8px 10px; border-radius:8px; color:var(--ink); font:500 14.5px/1.3 -apple-system, sans-serif; margin:2px 0; }
  nav.rail a.item.active, nav.rail a.item:hover { background:var(--accent-soft); color:var(--accent); text-decoration:none; }
  nav.rail .mod { margin-top:16px; font:700 11px/1 -apple-system, sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--soft); padding:0 10px 6px; }
  nav.rail a.topic { display:flex; gap:8px; align-items:baseline; padding:5px 10px; border-radius:6px; font:14px/1.3 -apple-system, sans-serif; color:var(--soft); }
  nav.rail a.topic .id { font-variant-numeric:tabular-nums; color:var(--soft); min-width:26px; }
  nav.rail a.topic.done { color:var(--ink); }
  nav.rail a.topic.done .id { color:var(--accent); font-weight:600; }
  nav.rail a.topic.next .id { color:var(--amber); font-weight:600; }
  nav.rail a.topic.active { background:var(--accent-soft); }
  main { flex:1; min-width:0; }
  .wrap { max-width:860px; margin:0 auto; padding:34px 28px 80px; }
  header.top { display:none; }
  h1 { font-size:34px; line-height:1.15; margin:0 0 6px; letter-spacing:-.01em; }
  h2 { font-size:22px; margin:34px 0 10px; }
  .kicker { font:600 12px/1 -apple-system, sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .muted { color:var(--soft); }
  .badge { font:700 10.5px/1 -apple-system, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:#fff; padding:4px 8px; border-radius:99px; background:var(--legacy); vertical-align:middle; }
  .badge.done { background:var(--accent); } .badge.next { background:var(--amber); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 22px; margin:14px 0; }
  .model { background:var(--accent-soft); border-left:4px solid var(--accent); border-radius:0 8px 8px 0; padding:16px 20px; font-size:19px; line-height:1.45; margin:16px 0; }
  .model .label, .card .label { display:block; font:700 11px/1 -apple-system, sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:8px; }
  .progress { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:10px 0 6px; }
  .progress i { display:block; height:100%; background:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:block; color:var(--ink); }
  .tile:hover { border-color:var(--accent); text-decoration:none; }
  .tile .id { font:700 12px/1 -apple-system, sans-serif; color:var(--accent); }
  .tile .t { font-size:16.5px; line-height:1.3; margin:6px 0 4px; }
  .tile.dim { opacity:.6; }
  .btn { display:inline-block; font:600 14px/1 -apple-system, sans-serif; padding:11px 16px; border-radius:9px; background:var(--accent); color:#fff !important; text-decoration:none !important; }
  .btn.ghost { background:transparent; color:var(--accent) !important; border:1.5px solid var(--accent); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  iframe.lesson { width:100%; height:calc(100vh - 40px); border:1px solid var(--line); border-radius:12px; background:#fff; }
  .ep { display:flex; gap:16px; align-items:flex-start; }
  .ep .no { font:700 26px/1 -apple-system, sans-serif; color:var(--accent); min-width:44px; }
  .quiz .q { margin:18px 0; }
  .quiz .q p { margin:0 0 8px; font-weight:600; }
  .quiz button.opt { display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:9px 12px; margin:6px 0; font:15px/1.4 Charter, Georgia, serif; color:var(--ink); cursor:pointer; }
  .quiz button.opt.right { background:var(--accent-soft); border-color:var(--accent); }
  .quiz button.opt.wrong { background:var(--amber-soft); border-color:var(--amber); }
  .quiz .why { font-size:14.5px; color:var(--soft); margin-top:6px; display:none; }
  .quiz .q.answered .why { display:block; }
  .score { font:600 14px/1 -apple-system, sans-serif; color:var(--accent); margin-top:10px; }
  ul.clean { padding-left:20px; } ul.clean li { margin:6px 0; }
  .notice { background:var(--amber-soft); border-left:4px solid var(--amber); padding:12px 16px; border-radius:0 8px 8px 0; font-size:15px; }
  .search { width:100%; font:15px/1.4 -apple-system, sans-serif; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin:8px 0 14px; background:#fff; }
  @media (max-width: 900px) {
    #app { display:block; }
    nav.rail { position:fixed; inset:0 auto 0 0; z-index:20; transform:translateX(-100%); transition:transform .2s; width:min(320px, 86vw); height:100vh; box-shadow:0 0 40px rgba(0,0,0,.2); }
    nav.rail.open { transform:none; }
    header.top { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); background:#f4f1ea; position:sticky; top:0; z-index:10; }
    header.top button { font:600 14px/1 -apple-system, sans-serif; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 12px; }
    header.top .t { font:700 13px/1 -apple-system, sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); }
    .wrap { padding:22px 16px 80px; }
    h1 { font-size:27px; }
    iframe.lesson { height:calc(100vh - 100px); }
  }
</style>

<script>
const DATA = {"title": "Agent Architecture", "subtitle": "Erik's syllabus, lessons, and episodes in one place", "generated": "2026-11-11", "modules": [{"no": 0, "title": "What an Agent Actually Is", "goal": "a precise mental model, so every later topic snaps into place.", "done_when": "you can sketch any agent product you use (Claude Code, Deep Research, a support bot) as loop + tools + context, and say which parts are workflow and which are agent.", "topics": [{"id": "0.1", "tag": "", "title": "The agentic loop", "desc": "Model + tools + a loop: gather context, take action, verify, repeat. Why \"the model is the engine, the harness is the car.\" What a \"harness\" is and why harness design is most of agent architecture.", "status": "Done", "taught": "2026-08-01", "file": "0.1.html", "episode": 1, "mental_model": "An agent is a model running in a loop with tools. Everything in the system that is not the model is the harness, and the harness is what you get to design.", "from_episode": ["Intelligence was never the bottleneck: a model call is a pure function, and what releases it is a loop with tools wrapped in a harness, with verification against ground truth as the load-bearing beat.", "Engine versus car: labs build engines you cannot retune; two harnesses around the identical engine produce a great product and a useless one.", "The AutoGPT-era post-mortem, said twice: the loop is only as good as its ground truth.", "After a model release, ask which harness parts were crutches (delete) and which are structure no engine improvement replaces (keep).", "Applied: a refund-issuing support agent. Investigating is loop territory; issuing is irreversible, so the harness owns it with a gate, and verify must be checkable, not vibes.", "Debugging heuristic for an agent that nails 5-step tasks but falls apart at 30: suspect the transcript, then the verify step, then missing externalized state, and only last the model."], "has_file": true}, {"id": "0.2", "tag": "", "title": "The workflow-vs-agent spectrum", "desc": "Predefined code paths (prompt chaining, routing, parallelization, evaluator-optimizer) vs. model-directed loops. The single most-cited framing in the field (Anthropic's \"Building Effective Agents\"). The real question: how much control flow do you write vs. delegate to the model?", "status": "Done", "taught": "2026-08-10", "file": "0.2.html", "episode": 2, "mental_model": "The question is never 'is this an agent.' It is 'how much control flow did I delegate to the model, and can I verify what it does with it?'", "has_file": true}, {"id": "0.3", "tag": "", "title": "Tools and tool design", "desc": "What a tool call actually is; why tool descriptions are prompts; token-efficient tool design; why filesystem + bash turned out to be the universal tools.", "status": "Done", "taught": "2026-08-13", "file": "0.3.html", "episode": 3, "mental_model": "A tool is two things at once: a contract with a deterministic system, and a prompt aimed at a non-deterministic one. Most bad tools are bad because someone only designed the first half.", "has_file": true}, {"id": "0.4", "tag": "landscape", "title": "Where this came from", "desc": "ReAct, chain-of-thought, AutoGPT-era hype, and why 2023-24 agent frameworks mostly failed. One sitting, no more, but this vocabulary still shows up everywhere.", "status": "Done", "taught": "2026-08-23", "file": "0.4.html", "episode": 4, "mental_model": "Agent history is one repeated lesson: scaffolding that substitutes for model capability gets eaten by the next model release, while scaffolding that contains consequences survives every one of them.", "has_file": true}]}, {"no": 1, "title": "Context Engineering (the core discipline)", "goal": "fluency in the field's center of gravity. This replaced \"prompt engineering,\" and everything else hangs off it.", "done_when": "given any agent misbehavior (\"it forgot the goal,\" \"it's slow and expensive,\" \"it got confused mid-task\"), your first three hypotheses are all context hypotheses, and they're usually right.", "topics": [{"id": "1.1", "tag": "", "title": "The attention budget", "desc": "Context as a finite, degrading resource: \"context rot,\" why more tokens do not mean better results, finding the smallest set of high-signal tokens. The system-prompt \"altitude\" idea (between hardcoded brittleness and vagueness).", "status": "Done", "taught": "2026-08-30", "file": "1.1.html", "episode": 5, "mental_model": "Every token in the window spends from a finite attention budget, so the question is never 'does it fit' but 'does this token pay for its seat.'", "has_file": true}, {"id": "1.2", "tag": "", "title": "The four operations: write / select / compress / isolate", "desc": "The standard taxonomy for everything you can do with context, plus the four failure modes (poisoning, distraction, confusion, clash).", "status": "Done", "taught": "2026-09-05", "file": "1.2.html", "episode": 6, "mental_model": "Between two model calls the harness has exactly four moves on the window: move something out, bring something in, shrink what stays, or wall something off. Every context failure is one of those moves made too late, and every fix is one made on purpose.", "has_file": true}, {"id": "1.3", "tag": "", "title": "Compaction and context editing", "desc": "Summarizing trajectories near the limit; tool-result clearing; why compression is lossy and what gets protected (decisions over details).", "status": "Done", "file": "1.3.html", "has_file": true, "taught": "2026-09-06", "mental_model": "A compaction is a bet, placed by something that cannot see the future, on what a future window will need. You cannot make the bet safe. You can only decide when it fires, what is exempt from it, and how you find out it lost.", "episode": 7}, {"id": "1.4", "tag": "", "title": "Just-in-time retrieval vs. pre-loading", "desc": "Keep identifiers (paths, queries) in context, load data via tools at runtime. Why coding agents converged on grep over embeddings, and where embeddings still win.", "status": "Done", "file": "1.4.html", "has_file": true, "taught": "2026-09-07", "mental_model": "Keep the locator in the window and the payload in the store: a pre-loaded payload is a relevance bet placed before step one, and a locator lets each step place that bet at the moment the need is actually knowable.", "episode": 8}, {"id": "1.5", "tag": "", "title": "Structured note-taking and recitation", "desc": "Agents writing todo.md / notes files to fight \"lost in the middle\"; keeping error traces in context so the model learns from failures mid-task.", "status": "Done", "file": "1.5.html", "has_file": true, "taught": "2026-09-13", "mental_model": "A note is a message from the agent to a later, poorer-informed version of itself; how far away that reader is decides what the note carries and how often it gets rewritten.", "episode": 9}, {"id": "1.6", "tag": "", "title": "Progressive disclosure and Skills", "desc": "Load a name and description always, full instructions only when relevant. Why Skills (procedural knowledge as files) became arguably a bigger deal than MCP.", "status": "Done", "file": "1.6.html", "has_file": true, "taught": "2026-09-20", "episode": 10, "mental_model": "A skill is the locator-and-payload move applied to instructions instead of data: the description stays in the window as a locator, the procedure stays on disk as a payload, and the whole design lives or dies on whether the description fires at the right moment."}, {"id": "1.7", "tag": "", "title": "KV-cache economics", "desc": "The roughly 10x cached/uncached price gap as a *design constraint*: stable prefixes, append-only context, and the tension with compaction. This is what separates people who've shipped agents from people who've read about them.", "status": "Done", "file": "1.7.html", "has_file": true, "taught": "2026-10-14", "episode": 11, "mental_model": "The cache bills you for change, not for size: every token up to the first one that differs from the last call is nearly free, every token after it is paid in full, so a cheap agent is one whose window only ever changes at the end."}]}, {"no": 2, "title": "Memory Architectures", "goal": "know every serious approach to agent memory, which is winning, and how to choose.", "done_when": "given a product description, you can pick a memory architecture, justify it against two alternatives, and name its failure modes (staleness, poisoning, lossy extraction) before they happen.", "topics": [{"id": "2.1", "tag": "", "title": "The vocabulary: episodic / semantic / procedural / working", "desc": "The cognitive-science framing that became standard design language, and the cardinal rule: don't mix memory types in one index with one retrieval strategy.", "status": "Done", "file": "2.1.html", "has_file": true, "taught": "2026-11-11", "mental_model": "A memory type is not a place to store things; it is a question the agent will ask its past: what am I doing (working), what happened (episodic), what is true (semantic), how do I do this (procedural). Each question needs its own write rule and its own way of being found, so one index that answers two of them answers both badly."}, {"id": "2.2", "tag": "", "title": "Filesystem-as-memory", "desc": "Plain files the agent reads and writes (CLAUDE.md, memory directories). Why this transparent, zero-infra approach became the production default for coding and computer-use agents. Tradeoffs: inspectable but unstructured; quality depends on what the model writes down.", "status": "Up next", "file": "2.2.html", "has_file": false}, {"id": "2.3", "tag": "", "title": "Self-editing memory blocks (MemGPT/Letta lineage)", "desc": "Labeled, size-bounded, always-in-context blocks the agent rewrites with its own tools. \"Memory design IS context engineering.\"", "status": "Not started", "file": "2.3.html", "has_file": false}, {"id": "2.4", "tag": "", "title": "Managed memory layers (Mem0-style)", "desc": "Hosted extract-consolidate-retrieve pipelines: LLM fact extraction, ADD/UPDATE/DELETE consolidation, multi-signal retrieval. The productized middle path and its benchmarks (LoCoMo, LongMemEval).", "status": "Not started", "file": "2.4.html", "has_file": false}, {"id": "2.5", "tag": "", "title": "Temporal knowledge-graph memory (Zep/Graphiti)", "desc": "Facts as graph edges with validity intervals, for \"facts that change over time\" and multi-hop questions. Ascendant for enterprise personalization; overkill for many uses (\"graph-lite\" hybrids emerging).", "status": "Not started", "file": "2.5.html", "has_file": false}, {"id": "2.6", "tag": "frontier", "title": "Consolidation and sleep-time compute", "desc": "Background processing that rewrites and refines memory off the hot path: Letta's sleep-time agents, ChatGPT's \"dreaming,\" memory-native RL. Arguably the defining 2026 memory trend.", "status": "Not started", "file": "2.6.html", "has_file": false}, {"id": "2.7", "tag": "", "title": "Forgetting, staleness, and memory security", "desc": "The five operations (store/retrieve/update/compress/forget) and why most teams skip three; memory poisoning (over 90% of tested agents vulnerable); deletion semantics as a compliance problem.", "status": "Not started", "file": "2.7.html", "has_file": false}, {"id": "2.8", "tag": "landscape", "title": "Vector-store RAG memory", "desc": "The 2023-24 default (embed chunks, cosine-retrieve) and precisely why it lost as a *memory* architecture while surviving as one retrieval signal among several.", "status": "Not started", "file": "2.8.html", "has_file": false}]}, {"no": 3, "title": "Tool Ecosystems and Protocols", "goal": "understand how agents connect to the world, and the economics of those connections.", "done_when": "you can explain why a 50-tool MCP setup is often an anti-pattern, and what to do instead.", "topics": [{"id": "3.1", "tag": "", "title": "MCP", "desc": "The universal agent-to-tool standard: what it actually specifies, why it won, and its 2026 maturation into boring enterprise infrastructure (stateless core, async tasks, authorization hardening).", "status": "Not started", "file": "3.1.html", "has_file": false}, {"id": "3.2", "tag": "", "title": "Code execution as the tool-use pattern", "desc": "Agents writing code against APIs instead of loading every tool definition into context (roughly 98% token reduction). Why \"give the agent a computer\" keeps beating \"give the agent a hundred tools.\"", "status": "Not started", "file": "3.2.html", "has_file": false}, {"id": "3.3", "tag": "landscape", "title": "Agent-to-agent protocols (A2A)", "desc": "The agent-to-agent layer: Agent Cards, cross-vendor interop. Real but narrow. Know when it matters (cross-org) and when it's resume-driven architecture (inside one app).", "status": "Not started", "file": "3.3.html", "has_file": false}]}, {"no": 4, "title": "Orchestration and Multi-Agent Systems", "goal": "know when multiple agents help, when they hurt, and the patterns that actually ship.", "done_when": "handed a task, you can say single-agent or multi-agent in under a minute, name the decomposition boundary, and estimate the token multiple you're signing up for.", "topics": [{"id": "4.1", "tag": "", "title": "The great multi-agent debate", "desc": "Cognition's \"Don't Build Multi-Agents\" vs. Anthropic's multi-agent research system, and the resolution: read-heavy tasks parallelize, write-heavy tasks need a single writer, and context sharing is the crux either way.", "status": "Not started", "file": "4.1.html", "has_file": false}, {"id": "4.2", "tag": "", "title": "The 2026 decision rule", "desc": "Default to a single agent. Go multi-agent only for context protection, parallelization of independent work, or genuine specialization, and decompose along *context boundaries*, not job titles. Why plan-implement-test-review is a bad split and \"independent research paths\" is a good one. Why role-play crews (PM-agent, engineer-agent) are a legacy anti-pattern.", "status": "Not started", "file": "4.2.html", "has_file": false}, {"id": "4.3", "tag": "", "title": "Orchestrator-subagent and fan-out", "desc": "Lead agent plus parallel workers returning compressed summaries. The token math (3-15x) and when it's worth it. The verification subagent as the most reliably useful pattern.", "status": "Not started", "file": "4.3.html", "has_file": false}, {"id": "4.4", "tag": "", "title": "Handoffs and routing", "desc": "Transfer-of-control (peer) vs. delegation-with-return (hierarchical); triage-to-specialist patterns for support-shaped products.", "status": "Not started", "file": "4.4.html", "has_file": false}, {"id": "4.5", "tag": "", "title": "Deterministic shells around nondeterministic agents", "desc": "Graph/state-machine orchestration (LangGraph-style), checkpointing, and the rival philosophy: skip the framework, give one capable model a computer. Who wins where (compliance vs. capability).", "status": "Not started", "file": "4.5.html", "has_file": false}, {"id": "4.6", "tag": "", "title": "Durable execution", "desc": "Agents that run for hours or days must survive crashes and waiting-for-human. Event-sourced, checkpointed execution as the line between demo agents and production agents.", "status": "Not started", "file": "4.6.html", "has_file": false}, {"id": "4.7", "tag": "", "title": "Human-in-the-loop gating", "desc": "The principle that won: gate irreversible *actions*, not reasoning. Approval tiers, plan modes, and the PR as the universal safety boundary.", "status": "Not started", "file": "4.7.html", "has_file": false}]}, {"no": 5, "title": "Self-Improvement Patterns", "goal": "the full landscape of how agents get better. What's production-real vs. research-only, and why the boring version won.", "done_when": "you can design a self-improvement loop for a real product and state exactly which layer it operates on (context, memory, skills, prompts, or weights) and why not the others.", "topics": [{"id": "5.1", "tag": "", "title": "The scoreboard", "desc": "The single most orienting view: which self-improvement patterns are production-real (skills, memory, offline prompt optimization), emerging (sleep-time learning, self-play), and research-only (open-ended self-modification). Start here.", "status": "Not started", "file": "5.1.html", "has_file": false}, {"id": "5.2", "tag": "", "title": "Skill libraries agents write for themselves", "desc": "The Voyager-to-Claude-Skills lineage: improvement as inspectable, versionable, permission-gated *files* rather than weight updates. The consensus \"safe self-improvement channel,\" and the pattern your tutor skill itself uses.", "status": "Not started", "file": "5.2.html", "has_file": false}, {"id": "5.3", "tag": "", "title": "Memory-based improvement", "desc": "Failures and corrections written to persistent memory, conditioning future behavior. Where it works, and \"memory rot\" / poisoned-drift as its failure modes. Evolving playbooks (ACE) as the research formalization.", "status": "Not started", "file": "5.3.html", "has_file": false}, {"id": "5.4", "tag": "", "title": "Automated prompt optimization (GEPA/DSPy)", "desc": "Reflective prompt evolution outperforming RL with 35x fewer rollouts; prompt optimization as offline software engineering with tests. Production-real for teams with eval sets.", "status": "Not started", "file": "5.4.html", "has_file": false}, {"id": "5.5", "tag": "landscape", "title": "Reflection loops (Reflexion lineage)", "desc": "Why \"LLM grades its own essay\" died (no external grounding) and what survived: verification against *tools*. Run the tests, read the error, fix it.", "status": "Not started", "file": "5.5.html", "has_file": false}, {"id": "5.6", "tag": "frontier", "title": "Learning at the frontier", "desc": "Agentic RL from trajectories (the labs' actual capability engine), test-time compute scaling and its verifier-bound ceiling, self-play task generation.", "status": "Not started", "file": "5.6.html", "has_file": false}, {"id": "5.7", "tag": "frontier", "title": "Agents improving agents", "desc": "Darwin Godel Machine (agents rewriting their own harness, with documented reward-hacking), AlphaEvolve (evolutionary code optimization, now shipping as a product), and why every production version is human-gated.", "status": "Not started", "file": "5.7.html", "has_file": false}]}, {"no": 6, "title": "Evaluation", "goal": "know how agents are actually judged, because eval design quietly drives architecture design.", "done_when": "for any agent you'd build, you can write down its eval before its architecture.", "topics": [{"id": "6.1", "tag": "", "title": "The production eval stack", "desc": "Eval sets mined from real traces; trajectory evals (grade the decisions) vs. end-state evals (grade the world afterward); LLM-as-judge with tight rubrics plus human spot-checks.", "status": "Not started", "file": "6.1.html", "has_file": false}, {"id": "6.2", "tag": "", "title": "Eval-driven architecture", "desc": "Why \"how will I verify this?\" is an architecture question: verifier quality bounds test-time scaling, black-box verification enables clean subagent splits, and automatable scoring functions are the precondition for evolutionary approaches.", "status": "Not started", "file": "6.2.html", "has_file": false}, {"id": "6.3", "tag": "landscape", "title": "The benchmark landscape", "desc": "SWE-bench and successors, computer-use and research-agent benchmarks, contamination problems, and the shift toward long-horizon real-work evals. Recognize the names; don't memorize the numbers.", "status": "Not started", "file": "6.3.html", "has_file": false}]}, {"no": 7, "title": "Safety and Security Architecture", "goal": "the threat model every architect must carry, and the containment stack that shipped.", "done_when": "you reflexively run the trifecta check on any agent design, including your own.", "topics": [{"id": "7.1", "tag": "", "title": "Prompt injection and the lethal trifecta", "desc": "The number-one unsolved problem. Private data + untrusted content + external communication: never all three in one context. This one rule reshapes real architectures.", "status": "Not started", "file": "7.1.html", "has_file": false}, {"id": "7.2", "tag": "", "title": "The containment stack", "desc": "Sandboxed execution, least-privilege tool permissioning, egress allowlists, approval tiers, human gates. Why the field bet on architectural containment over model-level immunity, and what that means for your designs.", "status": "Not started", "file": "7.2.html", "has_file": false}]}, {"no": 8, "title": "Synthesis: Reading Real Architectures", "goal": "cash in everything above by reverse-engineering the systems that define the field.", "done_when": "you can hear a new agent product announced and, before reading their docs, predict most of their architecture. Then check yourself.", "topics": [{"id": "8.1", "tag": "", "title": "Case studies", "desc": "Dissect three shipped agents end-to-end, e.g. Claude Code (single-threaded loop + skills + subagents), a Deep Research product (orchestrator + read fan-out), Manus (filesystem-as-context + KV-cache discipline). For each: memory choice, context strategy, orchestration shape, improvement loop, safety boundary.", "status": "Not started", "file": "8.1.html", "has_file": false}, {"id": "8.2", "tag": "", "title": "Design drills", "desc": "Given a product brief, produce a full architecture: memory, context plan, orchestration, eval, safety. Then defend it against the tutor playing skeptical staff engineer.", "status": "Not started", "file": "8.2.html", "has_file": false}, {"id": "8.3", "tag": "", "title": "Staying current", "desc": "The short list of sources worth following (Anthropic engineering blog, Simon Willison, Letta, LangChain blog, Cognition, key arXiv surveys), and how to tell a real shift from framework marketing.", "status": "Not started", "file": "8.3.html", "has_file": false}]}], "episodes": [{"no": 1, "title": "The Engine and the Car", g; Isolate via a subagent", "Distraction; Write the intent to a log"], "answer": 0, "why": "Too many tool definitions degrade selection; curate a tool loadout."}, {"q": "A support agent drafts a refusal because it lacks order history. Two turns later the history arrives via a tool, but the final answer still refuses, citing its own earlier draft. Which failure mode?", "options": ["Confusion; too many tool descriptions", "Clash; the model relies on its own premature assumption preserved in history", "Poisoning; a hardware error corrupted context", "Distraction; the user message exceeded the limit"], "answer": 1, "why": "Clash: an early wrong assumption in the history conflicts with the later fact and wins."}, {"q": "Following Deep Agents' operational order strictly, in what sequence do you trigger context-saving mechanisms?", "options": ["Summarize first, then offload inputs, then offload results", "Offload large tool results first, then old write/edit inputs at a threshold, summarize last", "Client-side compaction, then thinking-block clearing, then scratchpad", "Five subagents, then a pruner, then clear inputs"], "answer": 1, "why": "Offload results over 20k tokens as they occur, then old inputs at a threshold, summarize only when offloading is insufficient."}, {"q": "A long-running Sonnet 4.5 agent wraps up early as the window fills. To solve this without harness hacks that become dead weight on the next model, which structure do you build?", "options": ["Aggressive client-side compaction at 95%", "A decoupled session layer storing the conversation as an append-only log outside the window", "Recursive summarization that removes system messages", "A local classifier predicting wrap-up"], "answer": 1, "why": "A durable session log survives model releases; the context resets became dead weight."}, {"q": "Using server-side context editing with clear_tool_uses, which parameter matters most for prompt-cache economics?", "options": ["clear_tool_inputs true to erase tool     <div class="kicker">Module ${t.module.no}: ${esc(t.module.title)}</div>
    <h1>${t.id} ${esc(t.title)} ${badge(t)}</h1>
    <p class="muted">${esc(t.desc)}${t.taught ? ` <span class="ui" style="font-size:13px">&middot; taught ${esc(t.taught)}</span>` : ''}</p>
    ${t.mental_model ? `<div class="model"><span class="label">Carry this out of the room</span>${esc(t.mental_model)}</div>` : ''}
    ${t.status === 'Done' ? (t.has_file
        ? `<div class="row" style="margin:14px 0"><a class="btn" href="${file}">Open the tutorial full page</a><a class="btn ghost" href="#tutorial">Read it here</a></div>`
        : `<div class="notice">The tutorial file <code>site/lessons/${esc(t.file)}</code> is not in the site folder yet. Drop it in and rebuild.</div>`)
      : `<div class="notice ui" style="font-size:14px">${t.status === 'Up next' ? 'This is the next lesson. Ask the tutor: "teach me ' + t.id + '".' : 'Not taught yet.'}</div>`}
    ${episodeCard(ep)}
    ${t.from_episode ? `<div class="card"><span class="label">What the episode added</span><ul class="clean">${t.from_episode.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${ep ? quizHtml(ep) : ''}
    ${t.status === 'Done' && t.has_file ? `<h2 id="tutorial">Tutorial</h2><iframe class="lesson" src="${file}" title="${esc(t.title)}"></iframe>` : ''}
    <p class="ui muted" style="font-size:13px;margin-top:20px">${prevNext(t)}</p>`;
}
function prevNext(t) {
  const i = topics.findIndex(x => x.id === t.id);
  const p = topics[i - 1], n = topics[i + 1];
  return `${p ? `<a href="#/lesson/${p.id}">&larr; ${p.id} ${esc(p.title)}</a>` : ''}${p && n ? ' &nbsp;&middot;&nbsp; ' : ''}${n ? `<a href="#/lesson/${n.id}">${n.id} ${esc(n.title)} &rarr;</a>` : ''}`;
}

function episodes() {
  return `<div class="kicker">Companion podcast</div><h1>Episodes</h1><p class="muted">Each syllabus lesson gets a NotebookLM Deep Dive. Links open the public listen page.</p>
    ${DATA.episodes.map(e => episodeCard(e)).join('')}`;
}
function models() {
  return `<div class="kicker">Callbacks</div><h1>Mental models</h1><p class="muted">One sentence per lesson, verbatim. Later lessons quote these; they are the vocabulary the syllabus builds.</p>
    ${topics.filter(t => t.mental_model).map(t => `<div class="model"><span class="label"><a href="#/lesson/${t.id}">${t.id} ${esc(t.title)}</a> &middot; ${esc(t.taught)}</span>${esc(t.mental_model)}</div>`).join('')}`;
}

function route() {
  const h = location.hash || '#/';
  let view, active = h;
  if (h.startsWith('#/lesson/')) { view = lesson(h.slice(9)); }
  else if (h === '#/syllabus') view = syllabus();
  else if (h === '#/episodes') view = episodes();
  else if (h === '#/models') view = models();
  else { view = home(); active = '#/'; }
  rail(active); $('#view').innerHTML = view; $('#rail').classList.remove('open'); window.scrollTo(0, 0);
  document.title = h.startsWith('#/lesson/') ? `${h.slice(9)} ${(byId[h.slice(9)] || {}).title || ''} · Agent Architecture` : 'Agent Architecture';
}
window.addEventListener('hashchange', route);
$('#menu').addEventListener('click', () => $('#rail').classList.toggle('open'));
route();
</script>
</body>
</html>
